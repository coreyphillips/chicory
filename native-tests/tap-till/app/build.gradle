plugins {
    id 'com.android.application'
}

android {
    namespace 'com.chicory.taptill'
    compileSdk 37

    defaultConfig {
        applicationId 'com.chicory.taptill'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
